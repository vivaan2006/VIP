# What `python -m bea_corpus download` pulls from each of BEA's 12 datasets.
#
# For every dataset it saves the full dictionary (every parameter and all its values),
# then picks `sample_size` tables spread across the dataset's table list and downloads
# EVERY series in each of them.
#
#   table_param  the parameter that names a table in this dataset
#   params       the rest of the GetData request. ALL = every year / frequency / country,
#                so one call returns the whole table. Required parameters left out here
#                are filled with the dataset's "all" value automatically.
#   tables       optional: these tables instead of an evenly spread sample
#   split_by     optional: one request per value of this parameter, for datasets that refuse "everything" in one call
#   request_shapes  optional: extra request settings to try; every one that returns data is kept (MNE)
#   identity_params optional: request settings that change what the rows mean, so they go in the series id
#   check        optional: a dimension to compare against the dictionary's list for each table
#                (GetParameterValuesFiltered), so missing series show up in reports/issues.json
#
# Regional is special: BEA returns one line of a Regional table per call, so the
# downloader asks the dictionary for every line of the table and requests each one.

defaults:
  sample_size: 5

datasets:
  NIPA:                      # headline national accounts (GDP, income, PCE prices)
    table_param: TableName
    params: {Frequency: "A,Q,M", Year: ALL}

  NIUnderlyingDetail:        # finer detail behind NIPA tables
    table_param: TableName
    params: {Frequency: "A,Q,M", Year: ALL}

  FixedAssets:               # capital stock, depreciation (annual only)
    table_param: TableName
    params: {Year: ALL}

  GDPbyIndustry:             # value added by industry
    table_param: TableID
    params: {Frequency: "A,Q", Year: ALL, Industry: ALL}
    check: Industry

  UnderlyingGDPbyIndustry:   # finer industry detail (annual only)
    table_param: TableID
    params: {Frequency: A, Year: ALL, Industry: ALL}
    check: Industry

  InputOutput:               # industry-by-industry matrices, ~40 MB per table, so a smaller sample
    table_param: TableID
    params: {Year: ALL}
    sample_size: 2

  ITA:                       # balance of payments: one indicator, every country, every frequency
    table_param: Indicator
    params: {AreaOrCountry: ALL, Frequency: ALL, Year: ALL}
    check: AreaOrCountry

  IIP:                       # international investment position: one type, every component and frequency
    table_param: TypeOfInvestment
    params: {Component: ALL, Frequency: ALL, Year: ALL}

  IntlServTrade:             # services trade: one service type, every direction, affiliation, country
    table_param: TypeOfService
    params: {TradeDirection: ALL, Affiliation: ALL, AreaOrCountry: ALL, Year: ALL}
    check: AreaOrCountry

  IntlServSTA:               # services through affiliates: one channel, every industry, destination and country.
    table_param: Channel     # BEA won't send every country, industry and year in one call, so it's one call per country.
    params: {Destination: ALL, Industry: ALL, Year: ALL}
    split_by: AreaOrCountry

  MNE:                       # multinational enterprises. Each series exists for some directions, classifications
    table_param: SeriesID    # and ownership levels and not others, so every shape below is tried and EVERY one
    params: {Country: all, Year: ALL}   # that returns data is kept.
    tables: ["30", "31", "27", "25", "33"]   # the small default sample; --sample-size ignores this list
    identity_params: [DirectionOfInvestment, Classification, OwnershipLevel]  # part of each series' id
    request_shapes:
      # direct investment series (22-44, 62-69): no ownership level
      - {DirectionOfInvestment: outward, Classification: Country}
      - {DirectionOfInvestment: outward, Classification: Industry}
      - {DirectionOfInvestment: outward, Classification: CountryByIndustry}
      - {DirectionOfInvestment: inward, Classification: Country}
      - {DirectionOfInvestment: inward, Classification: Industry}
      - {DirectionOfInvestment: inward, Classification: CountryByIndustry}
      - {DirectionOfInvestment: inward, Classification: CountryofUBO}
      - {DirectionOfInvestment: inward, Classification: CountryofUBObyIndustry}
      - {DirectionOfInvestment: inward, Classification: CountrybyType}
      - {DirectionOfInvestment: inward, Classification: CountryofUBObyType}
      # operations of multinationals (AMNE, 1-21 and 46-61). 0 = majority-owned affiliates, 1 = all affiliates.
      # NonbankAffiliatesOnly 0 is what BEA requires for recent years. Parents must use OwnershipLevel 1.
      - {DirectionOfInvestment: outward, Classification: Country, OwnershipLevel: "0", NonbankAffiliatesOnly: "0"}
      - {DirectionOfInvestment: outward, Classification: Country, OwnershipLevel: "1", NonbankAffiliatesOnly: "0"}
      - {DirectionOfInvestment: outward, Classification: Industry, OwnershipLevel: "0", NonbankAffiliatesOnly: "0"}
      - {DirectionOfInvestment: outward, Classification: Industry, OwnershipLevel: "1", NonbankAffiliatesOnly: "0"}
      - {DirectionOfInvestment: outward, Classification: CountryByIndustry, OwnershipLevel: "0", NonbankAffiliatesOnly: "0"}
      - {DirectionOfInvestment: outward, Classification: CountryByIndustry, OwnershipLevel: "1", NonbankAffiliatesOnly: "0"}
      - {DirectionOfInvestment: inward, Classification: Country, OwnershipLevel: "0", NonbankAffiliatesOnly: "0"}
      - {DirectionOfInvestment: inward, Classification: Country, OwnershipLevel: "1", NonbankAffiliatesOnly: "0"}
      - {DirectionOfInvestment: inward, Classification: Industry, OwnershipLevel: "0", NonbankAffiliatesOnly: "0"}
      - {DirectionOfInvestment: inward, Classification: Industry, OwnershipLevel: "1", NonbankAffiliatesOnly: "0"}
      - {DirectionOfInvestment: inward, Classification: CountryByIndustry, OwnershipLevel: "0", NonbankAffiliatesOnly: "0"}
      - {DirectionOfInvestment: inward, Classification: CountryByIndustry, OwnershipLevel: "1", NonbankAffiliatesOnly: "0"}
      - {DirectionOfInvestment: parent, Classification: Industry, OwnershipLevel: "1", NonbankAffiliatesOnly: "0"}
      - {DirectionOfInvestment: state, Classification: StatebyCountryofUBO, OwnershipLevel: "0", NonbankAffiliatesOnly: "0"}
      - {DirectionOfInvestment: state, Classification: StatebyCountryofUBO, OwnershipLevel: "1", NonbankAffiliatesOnly: "0"}

  Regional:                  # states and metros: every line of each sampled table (see above)
    table_param: TableName
    params: {Year: ALL}
    sample_size: 3
