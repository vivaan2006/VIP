# What `python -m bea_corpus download` pulls from each of BEA's 12 datasets.
#
# For every dataset it saves the full dictionary (every parameter and all its values),
# then downloads EVERY series in EVERY table.
#
# `sample_size` and `tables` below only matter for a quick test run (`--sample` with no number):
# then it takes `sample_size` tables spread across each dataset's list, or the ones in `tables`.
#
#   table_param  the parameter that names a table in this dataset
#   params       the rest of the GetData request. ALL = every year / frequency / country,
#                so one call returns the whole table. Required parameters left out here
#                are filled with the dataset's "all" value automatically.
#   tables       optional: these tables instead of an evenly spread sample
#   split_by     optional: one request per value of this parameter, for datasets that refuse "everything" in one call
#   request_shapes  optional: extra request settings to try; every one that returns data is kept (MNE)
#   identity_params optional: request settings that change what the rows mean, so they go in the series id
#   check        optional: a dimension to compare against the dictionary's list for each table
#                (GetParameterValuesFiltered), so missing series show up in reports/issues.json
#
# Regional is special: BEA returns one line of a Regional table per call, so the
# downloader asks the dictionary for every line of the table and requests each one.

defaults:
  sample_size: 5

datasets:
  NIPA:                      # headline national accounts (GDP, income, PCE prices)
    table_param: TableName
    params: {Frequency: "A,Q,M", Year: ALL}

  NIUnderlyingDetail:        # finer detail behind NIPA tables
    table_param: TableName
    params: {Frequency: "A,Q,M", Year: ALL}

  FixedAssets:               # capital stock, depreciation (annual only)
    table_param: TableName
    params: {Year: ALL}

  GDPbyIndustry:             # value added by industry
    table_param: TableID
    params: {Frequency: "A,Q", Year: ALL, Industry: ALL}
    check: Industry

  UnderlyingGDPbyIndustry:   # finer industry detail (annual only)
    table_param: TableID
    params: {Frequency: A, Year: ALL, Industry: ALL}
    check: Industry

  InputOutput:               # industry-by-industry matrices, ~40 MB per table, so a smaller sample
    table_param: TableID
    params: {Year: ALL}
    sample_size: 2

  ITA:                       # balance of payments: one indicator, every country, every frequency
    table_param: Indicator
    params: {AreaOrCountry: ALL, Frequency: ALL, Year: ALL}
    check: AreaOrCountry

  IIP:                       # international investment position: one type, every component and frequency
    table_param: TypeOfInvestment
    params: {Component: ALL, Frequency: ALL, Year: ALL}

  IntlServTrade:             # services trade: one service type, every direction, affiliation, country
    table_param: TypeOfService
    params: {TradeDirection: ALL, Affiliation: ALL, AreaOrCountry: ALL, Year: ALL}
    check: AreaOrCountry

  IntlServSTA:               # services through affiliates: one channel, every industry, destination and country.
    table_param: Channel     # BEA won't send every country, industry and year in one call, so it's one call per country.
    params: {Destination: ALL, Industry: ALL, Year: ALL}
    split_by: AreaOrCountry

  MNE:                       # multinational enterprises. Each series exists for some directions, classifications
    table_param: SeriesID    # and ownership levels and not others, so every shape below is tried and EVERY one
    params: {Country: all, Year: ALL}   # that returns data is kept.
    tables: ["30", "31", "27", "25", "33"]   # only for a quick --sample run
    identity_params: [DirectionOfInvestment, Classification, OwnershipLevel]  # part of each series' id
    # Older and newer years of the same series (see NonbankAffiliatesOnly below) join into one history;
    # where the setting changes is listed in the series' definition_history.
    history_params: [NonbankAffiliatesOnly]
    # BEA lists these as defunct (beaapi's MNE series list). Still tried, but no data is reported as info.
    discontinued: "11, 13, 16, 19, 50-52, 55, 56"
    #
    # A list means "each of these": {DirectionOfInvestment: [outward, inward], Classification: [Country, Industry]}
    # is 4 shapes. `series` limits an entry to some series IDs, and null leaves a parameter out.
    # Shapes BEA turns down are remembered in
    # data/raw/cache/shapes_MNE.json for 60 days and skipped (--refresh tries them all again), and every
    # shape's result is in reports/shapes_MNE.json.
    #
    # Which series exist in which direction comes from BEA's own list:
    #   https://github.com/us-bea/beaapi/blob/main/docsrc/TA_MNE_series_list.csv
    # Activities of multinationals (AMNE, 1-21 and 46-61) need OwnershipLevel (0 = majority-owned, 1 = all
    # affiliates) and NonbankAffiliatesOnly: 1 for outward/parent years up to 2008 and inward up to 2006,
    # 0 after (BEA API guide, MNE appendix). Direct investment (22-44) and new FDI (62-69) take neither.
    request_shapes:            # the original 25, tried first for every series
      - {DirectionOfInvestment: outward, Classification: [Country, Industry, CountryByIndustry]}
      - {DirectionOfInvestment: inward,
         Classification: [Country, Industry, CountryByIndustry, CountryofUBO, CountryofUBObyIndustry,
                          CountrybyType, CountryofUBObyType]}
      - {DirectionOfInvestment: [outward, inward], Classification: [Country, Industry, CountryByIndustry],
         OwnershipLevel: ["0", "1"], NonbankAffiliatesOnly: "0"}
      - {DirectionOfInvestment: parent, Classification: Industry, OwnershipLevel: "1", NonbankAffiliatesOnly: "0"}
      - {DirectionOfInvestment: state, Classification: StatebyCountryofUBO, OwnershipLevel: ["0", "1"],
         NonbankAffiliatesOnly: "0"}

    # Tried after the original 25, only for the series they apply to. If one returns exactly the same
    # numbers as an original shape, the original keeps its series id (the extra is listed under also_as).
    # Classifications are limited to the series their description in BEA's dictionary covers.
    extra_request_shapes:
      # --- direct investment and new FDI ---
      - {series: "25, 27, 30-35, 39, 40", DirectionOfInvestment: outward, Classification: IndustryByCountry}
      - {series: "22-29, 41-44", DirectionOfInvestment: inward,
         Classification: [IndustryByCountry, IndustrybyCountryofUBO]}
      - {series: "62, 64, 66, 68, 69", DirectionOfInvestment: inward, Classification: [IndustrybyType, StatebyType]}
      - {series: "62", DirectionOfInvestment: inward, Classification: TypeofExpenditure}   # investment expenditures

      # --- goods and services supplied (58, 60, 61) ---
      # exactly the call BEA's own well-being code makes for 58 and 60 (Country 000 = all-countries total)
      - {series: "58, 60, 61", DirectionOfInvestment: outward, Classification: CountryByDestination, Country: "000",
         OwnershipLevel: "0", NonbankAffiliatesOnly: "0"}
      - {series: "58, 60, 61", DirectionOfInvestment: outward, Classification: [CountryByDestination, IndustryByDestination],
         OwnershipLevel: ["0", "1"], NonbankAffiliatesOnly: "0"}
      - {series: "58, 60", DirectionOfInvestment: inward, Classification: [CountryofUBObyDestination, IndustryByDestination],
         OwnershipLevel: "0", NonbankAffiliatesOnly: "0"}

      # --- AMNE outward (U.S. parents' foreign affiliates) ---
      - {series: "1, 3-8, 10, 12, 14, 54, 58, 60, 61", DirectionOfInvestment: outward, OwnershipLevel: ["0", "1"],
         NonbankAffiliatesOnly: "0",
         Classification: [IndustryByCountry, IndustryofUSParent, IndustryofUSParentAllIndustries, IndustryofUSParentByCountry]}
      - {series: "1, 3-8, 10, 12, 14, 54, 58, 60, 61", DirectionOfInvestment: outward, OwnershipLevel: ["0", "1"],
         NonbankAffiliatesOnly: "1",
         Classification: [Country, Industry, CountryByIndustry, IndustryByCountry, IndustryofUSParent,
                          IndustryofUSParentAllIndustries, IndustryofUSParentByCountry]}

      # --- AMNE inward (U.S. affiliates of foreign companies) ---
      - {series: "1, 2, 4-8, 10, 12, 14, 53", DirectionOfInvestment: inward, OwnershipLevel: ["0", "1"],
         NonbankAffiliatesOnly: "0",
         Classification: [IndustryByCountry, CountryofUBO, CountryofUBObyIndustry, IndustrybyCountryofUBO]}
      - {series: "1, 2, 4-8, 10, 12, 14, 53", DirectionOfInvestment: inward, OwnershipLevel: ["0", "1"],
         NonbankAffiliatesOnly: "1",
         Classification: [Country, Industry, CountryByIndustry, IndustryByCountry, CountryofUBO,
                          CountryofUBObyIndustry, IndustrybyCountryofUBO]}
      # "employment and sales for majority-owned U.S. affiliates" = series 4 and 8, majority-owned only
      - {series: "4, 8", DirectionOfInvestment: inward, Classification: IndustryofSales, OwnershipLevel: "0",
         NonbankAffiliatesOnly: ["0", "1"]}

      # --- AMNE parents and states ---
      - {series: "1, 3-8, 14, 20, 21, 46-48, 57", DirectionOfInvestment: parent, Classification: Industry,
         OwnershipLevel: "1", NonbankAffiliatesOnly: "1"}
      # gross PPE (2) by state is published before 2007 per BEA's dictionary, so it's in the state group too
      - {series: "2, 8, 9", DirectionOfInvestment: state, Classification: StatebyCountryofUBO,
         OwnershipLevel: ["0", "1"], NonbankAffiliatesOnly: "1"}
      # 9 (manufacturing employment) came back empty with every state shape in the original 25. BEA's note says
      # it needs this classification "even though no country data are provided", so guess: all-countries total
      # only (Country 000), or no Country at all (null = leave it out). Not confirmed by any BEA example.
      - {series: "8, 9", DirectionOfInvestment: state, Classification: StatebyCountryofUBO, Country: ["000", null],
         OwnershipLevel: ["0", "1"], NonbankAffiliatesOnly: ["0", "1"]}

      # --- discontinued series: only their older (nonbank-only) years could still be there ---
      - {series: "11, 13, 16, 19, 50-52, 55, 56", DirectionOfInvestment: [outward, inward],
         Classification: [Country, Industry, CountryByIndustry], OwnershipLevel: ["0", "1"], NonbankAffiliatesOnly: "1"}
      - {series: "11, 13, 16, 19, 50-52, 55, 56", DirectionOfInvestment: parent, Classification: Industry,
         OwnershipLevel: "1", NonbankAffiliatesOnly: "1"}

  Regional:                  # states and metros: every line of each sampled table (see above)
    table_param: TableName
    params: {Year: ALL}
    sample_size: 3
