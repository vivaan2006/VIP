# What `python -m bea_corpus download` pulls from each of BEA's 12 datasets.
#
# For every dataset it saves the full dictionary (every parameter and all its values),
# then downloads EVERY series in EVERY table.
#
# `sample_size` and `tables` below only matter for a quick test run (`--sample` with no number):
# then it takes `sample_size` tables spread across each dataset's list, or the ones in `tables`.
#
#   table_param  the parameter that names a table in this dataset
#   params       the rest of the GetData request. ALL = every year / frequency / country,
#                so one call returns the whole table. Required parameters left out here
#                are filled with the dataset's "all" value automatically.
#   tables       optional: these tables instead of an evenly spread sample
#   split_by     optional: one request per value of this parameter, for datasets that refuse "everything" in one call
#   request_shapes  optional: extra request settings to try; every one that returns data is kept (MNE)
#   identity_params optional: request settings that change what the rows mean, so they go in the series id
#   check        optional: a dimension to compare against the dictionary's list for each table
#                (GetParameterValuesFiltered), so missing series show up in reports/issues.json
#
# Regional is special: BEA returns one line of a Regional table per call, so the
# downloader asks the dictionary for every line of the table and requests each one.

defaults:
  sample_size: 5

datasets:
  NIPA:                      # headline national accounts (GDP, income, PCE prices)
    table_param: TableName
    params: {Frequency: "A,Q,M", Year: ALL}

  NIUnderlyingDetail:        # finer detail behind NIPA tables
    table_param: TableName
    params: {Frequency: "A,Q,M", Year: ALL}

  FixedAssets:               # capital stock, depreciation (annual only)
    table_param: TableName
    params: {Year: ALL}

  GDPbyIndustry:             # value added by industry
    table_param: TableID
    params: {Frequency: "A,Q", Year: ALL, Industry: ALL}
    check: Industry

  UnderlyingGDPbyIndustry:   # finer industry detail (annual only)
    table_param: TableID
    params: {Frequency: A, Year: ALL, Industry: ALL}
    check: Industry

  InputOutput:               # industry-by-industry matrices, ~40 MB per table, so a smaller sample
    table_param: TableID
    params: {Year: ALL}
    sample_size: 2

  ITA:                       # balance of payments: one indicator, every country, every frequency
    table_param: Indicator
    params: {AreaOrCountry: ALL, Frequency: ALL, Year: ALL}
    check: AreaOrCountry

  IIP:                       # international investment position: one type, every component and frequency
    table_param: TypeOfInvestment
    params: {Component: ALL, Frequency: ALL, Year: ALL}

  IntlServTrade:             # services trade: one service type, every direction, affiliation, country
    table_param: TypeOfService
    params: {TradeDirection: ALL, Affiliation: ALL, AreaOrCountry: ALL, Year: ALL}
    check: AreaOrCountry

  IntlServSTA:               # services through affiliates: one channel, every industry, destination and country.
    table_param: Channel     # BEA won't send every country, industry and year in one call, so it's one call per country.
    params: {Destination: ALL, Industry: ALL, Year: ALL}
    split_by: AreaOrCountry

  MNE:                       # multinational enterprises. Each series exists for some directions, classifications
    table_param: SeriesID    # and ownership levels and not others, so every shape below is tried and EVERY one
    params: {Country: all, Year: ALL}   # that returns data is kept.
    tables: ["30", "31", "27", "25", "33"]   # only for a quick --sample run
    identity_params: [DirectionOfInvestment, Classification, OwnershipLevel]  # part of each series' id
    # A list means "each of these": {DirectionOfInvestment: [outward, inward], Classification: [Country, Industry]}
    # is 4 shapes. `series` limits an entry to some series IDs. Shapes BEA turns down are remembered in
    # data/raw/cache/shapes_MNE.json and skipped on the next run (--refresh tries them all again), and every
    # shape's result is in reports/shapes_MNE.json.
    #
    # Series groups (BEA API guide, MNE appendix):
    #   direct investment (DI) 22-44, new foreign direct investment (BE-13 survey) 62-69: no ownership level
    #   activities of multinationals (AMNE) 1-21, 46-61: OwnershipLevel (0 = majority-owned, 1 = all affiliates)
    #     and NonbankAffiliatesOnly are required. NonbankAffiliatesOnly is 1 for outward years up to 2008 and
    #     inward years up to 2006, 0 after, so both are tried. They describe the same series, so they are NOT
    #     in identity_params: the old (nonbank-only) and new (bank and nonbank) years join into one history.
    #     Parents need OwnershipLevel 1.
    request_shapes:
      # --- the original 25, tried for every series ---
      - {DirectionOfInvestment: outward, Classification: [Country, Industry, CountryByIndustry]}
      - {DirectionOfInvestment: inward,
         Classification: [Country, Industry, CountryByIndustry, CountryofUBO, CountryofUBObyIndustry,
                          CountrybyType, CountryofUBObyType]}
      - {DirectionOfInvestment: [outward, inward], Classification: [Country, Industry, CountryByIndustry],
         OwnershipLevel: ["0", "1"], NonbankAffiliatesOnly: "0"}
      - {DirectionOfInvestment: parent, Classification: Industry, OwnershipLevel: "1", NonbankAffiliatesOnly: "0"}
      - {DirectionOfInvestment: state, Classification: StatebyCountryofUBO, OwnershipLevel: ["0", "1"],
         NonbankAffiliatesOnly: "0"}

      # --- DI: classifications the original list never tried ---
      - {series: "22-44, 62-69", DirectionOfInvestment: [outward, inward], Classification: IndustryByCountry}
      - {series: "22-44, 62-69", DirectionOfInvestment: inward, Classification: IndustrybyCountryofUBO}
      - {series: "62-69", DirectionOfInvestment: inward, Classification: [IndustrybyType, StatebyType, TypeofExpenditure]}

      # --- AMNE: older years (NonbankAffiliatesOnly 1) ---
      - {series: "1-21, 46-61", DirectionOfInvestment: [outward, inward], Classification: [Country, Industry, CountryByIndustry],
         OwnershipLevel: ["0", "1"], NonbankAffiliatesOnly: "1"}
      - {series: "1-21, 46-61", DirectionOfInvestment: parent, Classification: Industry, OwnershipLevel: "1",
         NonbankAffiliatesOnly: "1"}
      - {series: "1-21, 46-61", DirectionOfInvestment: state, Classification: StatebyCountryofUBO,
         OwnershipLevel: ["0", "1"], NonbankAffiliatesOnly: "1"}

      # --- AMNE: classifications the original list never tried (sales, services supplied by destination, ...) ---
      - {series: "1-21, 46-61", DirectionOfInvestment: outward,
         Classification: [IndustryByCountry, CountryByDestination, IndustryByDestination, IndustryofUSParent,
                          IndustryofUSParentAllIndustries, IndustryofUSParentByCountry],
         OwnershipLevel: ["0", "1"], NonbankAffiliatesOnly: "0"}
      - {series: "1-21, 46-61", DirectionOfInvestment: inward,
         Classification: [IndustryByCountry, CountryofUBO, CountryofUBObyIndustry, IndustrybyCountryofUBO,
                          CountryofUBObyDestination, IndustryByDestination, IndustryofSales],
         OwnershipLevel: ["0", "1"], NonbankAffiliatesOnly: "0"}

  Regional:                  # states and metros: every line of each sampled table (see above)
    table_param: TableName
    params: {Year: ALL}
    sample_size: 3
